<!DOCTYPE html>
<html lang="es">
<head>
    <script>(function(){const t=localStorage.getItem('theme');if(t==='dark')document.documentElement.classList.add('dark-mode');})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CSI Gestión</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            background: var(--login-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            transition: background 0.3s ease;
        }

        /* Top Theme Toggle for Login */
        .login-theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            font-size: 1.5rem;
            color: var(--text-primary);
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s;
        }
        
        .login-theme-toggle:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--login-card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: all 0.3s ease;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            background: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 32px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .login-title {
            color: var(--login-text-title);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Floating Labels CSS */
        .input-group {
            margin-bottom: 25px;
            text-align: left;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            height: 50px;
            border-radius: 10px;
            caret-color: transparent;
            outline: none;
        }

        .input-wrapper * {
             outline: none;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            z-index: 10;
            transition: color 0.3s;
            pointer-events: none;
            user-select: none;
            caret-color: transparent;
        }

        .input-group input {
            width: 100%;
            height: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid var(--login-input-border);
            border-radius: 10px;
            font-size: 1rem;
            line-height: 1.5;
            transition: all 0.3s;
            font-family: inherit;
            background: var(--login-input-bg);
            color: var(--text-primary);
            caret-color: var(--accent-color);
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
            display: block;
        }
        
        .input-group input::-ms-reveal,
        .input-group input::-ms-clear {
            display: none;
        }

        /* Floating effect */
        .input-group label {
            position: absolute;
            left: 45px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--login-input-bg);
            padding: 0 5px;
            color: var(--text-muted);
            font-size: 1rem;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 5;
        }

        .input-group input:focus,
        .input-group input:not(:placeholder-shown) {
            border-color: var(--accent-color);
            outline: none;
            box-shadow: none;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 0;
            left: 15px;
            font-size: 0.8rem;
            color: var(--accent-color);
            font-weight: 600;
            background: var(--login-input-bg);
            padding: 0 4px;
            z-index: 20;
        }
        
        .input-group input:not(:placeholder-shown) + label {
             color: var(--text-muted);
        }
        
        .input-group input:focus + label {
             color: var(--accent-color) !important;
        }

        .input-group input:focus ~ i {
            color: var(--accent-color);
        }

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .forgot-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--accent-color);
            text-decoration: underline;
            filter: brightness(1.2);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--btn-primary-bg);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            background: var(--btn-primary-hover);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

<i class="fas fa-moon login-theme-toggle" id="theme-toggle" onclick="toggleTheme()"></i>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-cube"></i>
            </div>
            <h1 class="login-title">Bienvenido</h1>
            <p class="login-subtitle">Inicia sesión para continuar</p>
        </div>

        <div id="loginError" class="error-msg">
            <i class="fas fa-exclamation-circle"></i> Usuario o contraseña incorrectos
        </div>

        <form id="loginForm">
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder=" " required>
                    <label for="username">Usuario</label>
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder=" " required>
                    <label for="password">Contraseña</label>
                    <i class="fas fa-eye password-toggle-icon" onclick="togglePasswordVisibility('password', this)" style="right: 15px; left: auto; color: #94a3b8; pointer-events: auto;"></i>
                </div>
            </div>

            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>Recordar usuario</span>
                </label>
                <a href="#" class="forgot-link" id="forgotBtn">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>
    </div>
</div>

<!-- Modal Recuperar Contraseña -->
<div id="recoveryModal" class="modal-overlay" style="display: none;">
    <div class="login-card" style="max-width: 350px; position: relative;">
        <button id="closeRecoveryBtn" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b;"><i class="fas fa-times"></i></button>
        <div class="login-header" style="margin-bottom: 20px;">
            <div class="login-logo" style="width: 60px; height: 60px; font-size: 24px;">
                <i class="fas fa-key"></i>
            </div>
            <h2 class="login-title" style="font-size: 1.5rem;">Recuperar</h2>
            <p class="login-subtitle">Introduce tu email o usuario para restablecer la contraseña</p>
        </div>
        
        <div id="recoveryMsg" class="error-msg" style="display: none; background: #dcfce7; color: #166534; border-color: #bbf7d0;"></div>

        <form id="recoveryForm">
            <div class="input-group">
                <label for="recoveryEmail"></label>
                <div class="input-wrapper">
                    <i class="fas fa-user-shield"></i>
                    <input type="text" id="recoveryEmail" placeholder="Email o Usuario" required>
                </div>
            </div>
            <button type="submit" class="btn-login">Enviar Instrucciones</button>
        </form>
    </div>
</div>

<style>
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    animation: fadeIn 0.3s;
}
</style>

<script src="js/main.js"></script>
<script src="js/login.js"></script>

</body>
</html>
